name: Sync Rime Dictionaries

on:
  schedule:
    # 计划每天 UTC 21:00（北京时间次日 05:00）触发，实际调度可能延迟
    - cron: '0 21 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Set date
        id: date
        # 使用东八区运行日期，与北京时间的发布日期保持一致
        run: echo "DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV

      - name: Download previous release package
        # 最新已发布且非当天 tag 的全量包：恢复 custom_dicts 起点 + 增量
        # 包基线；不能取列表序号（草稿排在已发布之后，.[1] 会取到前天）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(gh api "repos/${{ github.repository }}/releases?per_page=10" \
            --jq "[.[] | select(.draft == false and .tag_name != \"v${{ env.DATE }}\")] | .[0].tag_name // empty")
          if [ -z "$PREV_TAG" ]; then
            echo "无已发布的历史 release，custom_dicts 从零开始、跳过增量包"
            exit 0
          fi
          PREV_DATE="${PREV_TAG#v}"
          mkdir -p prev_release
          if ! gh release download "$PREV_TAG" -R "${{ github.repository }}" \
              -p "fuyaorime-${PREV_DATE}.zip" -D prev_release; then
            echo "下载上一版全量包失败，custom_dicts 从零开始、跳过增量包"
            exit 0
          fi
          echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_ENV"
          echo "PREV_DATE=${PREV_DATE}" >> "$GITHUB_ENV"
          echo "上一版全量包: ${PREV_TAG}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Clone rime-ice
        run: |
          git clone --depth 1 https://github.com/iDvel/rime-ice.git upstream/rime-ice

      - name: Download wanxiang grammar
        run: |
          mkdir -p upstream/wanxiang
          curl -L -o upstream/wanxiang/wanxiang-lts-zh-hans.gram \
            "https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram"
          curl -s "https://api.github.com/repos/amzxyz/RIME-LMDG/releases/tags/LTS" | \
            python3 -c "import sys,json; data=json.load(sys.stdin); \
            assets=[a for a in data['assets'] if a['name']=='wanxiang-lts-zh-hans.gram']; \
            print(assets[0]['updated_at'].split('T')[0].replace('-','') if assets else '')" \
            > upstream/wanxiang/version.txt

      - name: Restore custom_dicts from previous package
        # 词库不入库：从上一版全量包恢复起点，"本地版本新于远端则跳过"
        # 的保护才能跨运行生效
        run: |
          if [ -z "$PREV_TAG" ]; then
            exit 0
          fi
          unzip -q "prev_release/fuyaorime-${PREV_DATE}.zip" 'custom_dicts/*' -d .
          echo "已从 ${PREV_TAG} 恢复词库版本:"
          grep -H '^version:' custom_dicts/*.dict.yaml

      - name: Download extra dictionaries
        run: |
          pip3 install pypinyin opencc regex more-itertools
          python3 scripts/update_dicts.py

      - name: Build zhwiki dictionaries from dumps (monthly)
        # dump 三库按月去重：当月批次建成即停，未就绪由每日运行重试；
        # web-slang 每日快照维基页面，内容无变化不落盘
        run: python3 scripts/build_zhwiki.py

      - name: Merge files
        run: |
          chmod +x scripts/merge.sh
          bash scripts/merge.sh

      - name: Create release package
        run: |
          cd output
          zip -r ../fuyaorime-${{ env.DATE }}.zip .

      - name: Create incremental diff package
        # 基线 zip 已在 prev_release/，与 custom_dicts 恢复共用同一次下载
        run: |
          if [ -z "$PREV_TAG" ]; then
            echo "无历史 release，跳过增量包"
            exit 0
          fi
          python3 scripts/make_diff_package.py output \
            "prev_release/fuyaorime-${PREV_DATE}.zip" \
            "fuyaorime-${{ env.DATE }}-diff-from-${PREV_DATE}.zip" \
            "$PREV_DATE" "${{ env.DATE }}"

      - name: Generate release notes
        run: |
          echo "自动同步的 Rime 配置包" > release_notes.md
          echo "" >> release_notes.md

          HAS_CHANGES=false
          RIME_ICE_HASH_FILE="scripts/.rime_ice_hash"
          WANXIANG_HASH_FILE="scripts/.wanxiang_hash"

          echo "## 上游更新" >> release_notes.md
          echo "" >> release_notes.md

          # 雾凇拼音对比
          echo "### 雾凇拼音 (rime-ice)" >> release_notes.md
          cd upstream/rime-ice
          CURRENT_HASH=$(git rev-parse --short HEAD)
          cd ../..
          if [ -f "$RIME_ICE_HASH_FILE" ]; then
            PREV_HASH=$(cat "$RIME_ICE_HASH_FILE")
            if [ "$CURRENT_HASH" != "$PREV_HASH" ]; then
              CHANGES=$(cd upstream/rime-ice && git log -1 --format="- [%h](https://github.com/iDvel/rime-ice/commit/%H) %s (%cd)" --date=short 2>/dev/null)
              echo "$CHANGES" >> release_notes.md
              HAS_CHANGES=true
            else
              echo "- 无更新" >> release_notes.md
            fi
          fi
          echo "$CURRENT_HASH" > "$RIME_ICE_HASH_FILE"

          # 语言模型版本
          echo "### 语言模型" >> release_notes.md
          if [ -f upstream/wanxiang/version.txt ]; then
            gram_version=$(cat upstream/wanxiang/version.txt)
            echo "- 万象语言模型版本: $gram_version" >> release_notes.md
          fi
          echo "" >> release_notes.md

          # 获取自定义词库更新信息
          echo "## 自定义词库更新" >> release_notes.md
          echo "" >> release_notes.md

          # 检查各个自定义词库是否有更新
          CUSTOM_DICTS=("zhwiki" "web-slang" "zhwikisource" "zhwiktionary" "moegirl" "cn_places" "popular_new_words" "chinese_names" "chengyu_suyu" "gushi_mingju" "tangshi_300")
          for dict_name in "${CUSTOM_DICTS[@]}"; do
            dict_file="custom_dicts/${dict_name}.dict.yaml"
            if [ -f "$dict_file" ]; then
              version=$(grep -oP 'version:\s*"?\K[^"\s]+' "$dict_file" 2>/dev/null || echo "未知")
              echo "- ${dict_name} (版本: ${version})" >> release_notes.md
              HAS_CHANGES=true
            fi
          done
          echo "" >> release_notes.md

          # 如果没有任何更新，显示例行更新
          if [ "$HAS_CHANGES" = false ]; then
            echo "## 更新说明" >> release_notes.md
            echo "" >> release_notes.md
            echo "- 例行更新，上游无变更" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # 增量包说明
          DIFF_ZIP=$(ls fuyaorime-${{ env.DATE }}-diff-from-*.zip 2>/dev/null | head -1)
          if [ -n "$DIFF_ZIP" ]; then
            echo "## 增量更新包" >> release_notes.md
            echo "" >> release_notes.md
            echo "- \`${DIFF_ZIP}\`：相对上一版的增量包，已安装上一版的用户下载后解压覆盖到 Rime 配置目录并重新部署即可，详见包内 INCREMENTAL-README.txt" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # 包含内容说明
          echo "## 包含内容" >> release_notes.md
          echo "- 雾凇拼音全部输入方案（全拼、七种双拼、九键 T9 等）" >> release_notes.md
          echo "- 雾凇拼音最新词库" >> release_notes.md
          echo "- 万象拼音语言模型" >> release_notes.md
          echo "- 自定义词库（维基百科、萌娘百科等）" >> release_notes.md
          echo "- 自定义皮肤和配置" >> release_notes.md
          echo "" >> release_notes.md

          # 使用方法
          echo "## 使用方法" >> release_notes.md
          echo "1. 下载 \`fuyaorime-*.zip\`" >> release_notes.md
          echo "2. 解压到 Rime 配置目录" >> release_notes.md
          echo "3. 重新部署" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.DATE }}
          name: FuyaoRime ${{ env.DATE }}
          body_path: release_notes.md
          files: fuyaorime-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update hash files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/.rime_ice_hash scripts/.zhwiki_build_rules
          git diff --cached --quiet || git commit -m "chore: 更新上游仓库 hash 记录"
          git push
