name: Sync Rime Dictionaries

on:
  schedule:
    # 计划每天 UTC 21:00（北京时间次日 05:00）触发，实际调度可能延迟
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: '同日修订号，1 不加后缀，2 发布为 -v2'
        required: true
        default: '1'
        type: string
      release_note:
        description: '本次主要更新，留空使用例行同步说明'
        required: false
        default: ''
        type: string

concurrency:
  group: fuyaorime-sync-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Set release version
        env:
          RELEASE_REVISION: ${{ github.event.inputs.revision || '1' }}
        run: |
          python3 - <<'PYTHON'
          import datetime, os, re
          revision = os.environ['RELEASE_REVISION']
          if not re.fullmatch(r'[1-9][0-9]{0,3}', revision):
              raise SystemExit('revision 必须为 1 至 9999 的整数')
          date = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y%m%d')
          version = date if revision == '1' else f'{date}-v{revision}'
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write(f'DATE={date}\nVERSION={version}\n')
          PYTHON

      - name: Download previous release package
        # 选择当前目标版本之前的最近稳定版，同时作为词库恢复起点与增量基线。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" > previous-releases.json
          PREV_TAG=$(python3 scripts/release_notes.py previous "$VERSION" < previous-releases.json)
          if [ -z "$PREV_TAG" ]; then
            echo "无已发布的历史 release，custom_dicts 从零开始、跳过增量包"
            exit 0
          fi
          PREV_DATE="${PREV_TAG#v}"
          mkdir -p prev_release
          gh release download "$PREV_TAG" -R "${{ github.repository }}" \
            -p "fuyaorime-${PREV_DATE}.zip" -D prev_release
          echo "PREV_TAG=${PREV_TAG}" >> "$GITHUB_ENV"
          echo "PREV_DATE=${PREV_DATE}" >> "$GITHUB_ENV"
          echo "上一版全量包: ${PREV_TAG}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Clone rime-ice
        run: |
          git clone --depth 1 https://github.com/iDvel/rime-ice.git upstream/rime-ice

      - name: Download tone-marked radical readings
        run: python3 scripts/fetch_radical_readings.py

      - name: Download wanxiang grammar
        run: |
          mkdir -p upstream/wanxiang
          curl -L -o upstream/wanxiang/wanxiang-lts-zh-hans.gram \
            "https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram"
          curl -s "https://api.github.com/repos/amzxyz/RIME-LMDG/releases/tags/LTS" | \
            python3 -c "import sys,json; data=json.load(sys.stdin); \
            assets=[a for a in data['assets'] if a['name']=='wanxiang-lts-zh-hans.gram']; \
            print(assets[0]['updated_at'].split('T')[0].replace('-','') if assets else '')" \
            > upstream/wanxiang/version.txt

      - name: Restore custom_dicts from previous package
        # 词库不入库：从上一版全量包恢复起点，"本地版本新于远端则跳过"
        # 的保护才能跨运行生效
        run: |
          if [ -z "$PREV_TAG" ]; then
            exit 0
          fi
          unzip -q "prev_release/fuyaorime-${PREV_DATE}.zip" 'custom_dicts/*' -d .
          echo "已从 ${PREV_TAG} 恢复词库版本:"
          grep -H '^version:' custom_dicts/*.dict.yaml

      - name: Download extra dictionaries
        run: |
          pip3 install pypinyin opencc regex more-itertools
          python3 scripts/update_dicts.py

      - name: Build zhwiki dictionaries from dumps (monthly)
        # dump 三库按月去重：当月批次建成即停，未就绪由每日运行重试；
        # web-slang 每日快照维基页面，内容无变化不落盘
        run: python3 scripts/build_zhwiki.py

      - name: Merge files
        run: |
          chmod +x scripts/merge.sh
          bash scripts/merge.sh

      - name: Create release package
        run: |
          cd output
          zip -r ../fuyaorime-${{ env.VERSION }}.zip .

      - name: Create incremental diff package
        # 基线 zip 已在 prev_release/，与 custom_dicts 恢复共用同一次下载
        run: |
          if [ -z "$PREV_TAG" ]; then
            echo "无历史 release，跳过增量包"
            exit 0
          fi
          python3 scripts/make_diff_package.py output \
            "prev_release/fuyaorime-${PREV_DATE}.zip" \
            "fuyaorime-${{ env.VERSION }}-diff-from-${PREV_DATE}.zip" \
            "$PREV_DATE" "$VERSION" --summary diff-summary.json

      - name: Generate release notes
        env:
          RELEASE_HIGHLIGHT: ${{ github.event.inputs.release_note || '' }}
        run: python3 scripts/release_notes.py render "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ env.VERSION }}
          name: FuyaoRime ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body_path: release_notes.md
          files: fuyaorime-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update hash files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git -C upstream/rime-ice rev-parse --short HEAD > scripts/.rime_ice_hash
          git add scripts/.rime_ice_hash scripts/.zhwiki_build_rules
          git diff --cached --quiet || git commit -m "chore: 更新上游仓库 hash 记录"
          git push
