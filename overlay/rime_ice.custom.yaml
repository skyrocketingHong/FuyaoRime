patch:
  engine/processors/+:
    - lua_processor@*user_predict*P
  engine/translators/+:
    - lua_translator@*user_predict*T
  engine/filters/+:
    - lua_filter@*user_predict*F
  switches/+:
    - name: prediction
      states: [ 预测关, 预测开 ]
      reset: 0
  "grammar/language": "wanxiang-lts-zh-hans"
  "grammar/collocation_max_length": 8
  "grammar/collocation_min_length": 2
  "grammar/collocation_penalty": -16
  "grammar/non_collocation_penalty": -8
  "grammar/weak_collocation_penalty": -100
  "grammar/rear_penalty": -12
  "translator/contextual_suggestions": false
  "translator/max_homophones": 7
  "translator/max_homographs": 7
  "translator/dictionary": rime_ice.custom # 挂载词库 rime_ice.custom.dict.yaml
  schema_list:
    - schema: rime_ice # 雾凇拼音（全拼）
  "reduce_english_filter/mode": all # all | custom | none
  "radical_reverse_lookup/dictionary": zdict
  ascii_composer:
    good_old_caps_lock: true # true | false
    switch_key:
      Caps_Lock: clear # commit_code | commit_text | clear
      Shift_L: commit_code # commit_code | commit_text | inline_ascii | clear | noop
      Shift_R: commit_code # commit_code | commit_text | inline_ascii | clear | noop
      Control_L: noop # commit_code | commit_text | inline_ascii | clear | noop
      Control_R: noop # commit_code | commit_text | inline_ascii | clear | noop
  "key_binder/bindings/+":
    - { accept: KP_Enter, send: Return, when: composing }
  "speller/algebra/+":
    ### 模糊音
    # 声母
    - derive/^([zcs])h/$1/ # zh* ch* sh* 派生出 z* c* s*
    - derive/^([zcs])([^h])/$1h$2/ # z* c* s*    派生出 zh* ch* sh*
    - derive/^l/n/ # 解释：为 l 开头的拼写派生出 n 开头，即 nai 也可以输出 lai（来、莱、赖……）
    - derive/^n/l/ #      lai 可输出 nai（奶、乃、奈……）。 可以单向或成对儿启用模糊音
    # 韵母
    - derive/eng$/en/
    - derive/en$/eng/
    - derive/in$/ing/
    - derive/ing$/in/
    - derive/on$/ong/
    - derive/ong$/on/

    ### 旧时的拼写规则
    - derive/un$/uen/
    - derive/ui$/uei/
    - derive/iu$/iou/
  menu:
    page_size: 9
